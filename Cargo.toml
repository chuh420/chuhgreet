[package]
name = "chuhgreet"
version = "0.1.0"
edition = "2024"

[dependencies]
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
strip = true
